<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard de ventas</title>
  <style>
    :root {
      --bg: #f6f7f9;
      --panel: #ffffff;
      --ink: #172026;
      --muted: #66727f;
      --line: #dfe5eb;
      --green: #2f8f6f;
      --blue: #356ac3;
      --amber: #c9822b;
      --rose: #b64e63;
      --shadow: 0 14px 36px rgba(31, 42, 55, .08);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: 0;
    }
    header {
      padding: 28px clamp(18px, 4vw, 48px) 18px;
      background: #fff;
      border-bottom: 1px solid var(--line);
    }
    h1 {
      margin: 0;
      font-size: clamp(26px, 4vw, 42px);
      font-weight: 760;
      letter-spacing: 0;
    }
    .sub {
      margin-top: 7px;
      color: var(--muted);
      font-size: 14px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px 14px;
      align-items: center;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      display: inline-block;
      background: var(--amber);
      margin-right: 6px;
    }
    .status-dot.ok { background: var(--green); }
    .status-dot.bad { background: var(--rose); }
    main { padding: 22px clamp(18px, 4vw, 48px) 46px; }
    .toolbar {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
      margin-bottom: 18px;
    }
    select, input, button {
      height: 38px;
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 7px;
      color: var(--ink);
      padding: 0 12px;
      min-width: 170px;
      font: inherit;
    }
    button {
      min-width: 132px;
      cursor: pointer;
      font-weight: 700;
      color: #fff;
      background: var(--blue);
      border-color: var(--blue);
    }
    button:disabled {
      cursor: wait;
      opacity: .75;
    }
    .kpis {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(165px, 1fr));
      gap: 12px;
      margin-bottom: 18px;
    }
    .goal-panel {
      display: grid;
      grid-template-columns: minmax(180px, 260px) 1fr minmax(110px, 150px);
      gap: 16px;
      align-items: center;
      margin-bottom: 18px;
      padding: 16px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }
    .goal-title {
      font-size: 13px;
      color: var(--muted);
      text-transform: uppercase;
      font-weight: 800;
    }
    .goal-number {
      margin-top: 7px;
      font-size: 30px;
      font-weight: 800;
    }
    .goal-track {
      height: 16px;
      background: #eef2f5;
      border-radius: 999px;
      overflow: hidden;
    }
    .goal-fill {
      height: 100%;
      width: 0;
      background: var(--green);
      border-radius: 999px;
      transition: width .25s ease;
    }
    .goal-side {
      text-align: right;
      font-variant-numeric: tabular-nums;
    }
    .kpi, .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }
    .kpi { padding: 16px; min-height: 96px; }
    .label {
      color: var(--muted);
      font-size: 12px;
      text-transform: uppercase;
      font-weight: 700;
    }
    .value {
      margin-top: 8px;
      font-size: clamp(22px, 3vw, 31px);
      font-weight: 780;
      white-space: nowrap;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }
    .panel {
      padding: 18px;
      min-width: 0;
    }
    .panel h2 {
      font-size: 17px;
      margin: 0 0 14px;
      letter-spacing: 0;
    }
    .wide { grid-column: 1 / -1; }
    .bar-row {
      display: grid;
      grid-template-columns: minmax(110px, 210px) 1fr 92px;
      gap: 10px;
      align-items: center;
      min-height: 30px;
      font-size: 13px;
    }
    .bar-label {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: #26323b;
    }
    .bar-track {
      height: 12px;
      background: #eef2f5;
      border-radius: 999px;
      overflow: hidden;
    }
    .bar {
      height: 100%;
      border-radius: 999px;
      background: var(--blue);
    }
    .bar-row:nth-child(4n) .bar { background: var(--green); }
    .bar-row:nth-child(4n+1) .bar { background: var(--amber); }
    .bar-row:nth-child(4n+2) .bar { background: var(--rose); }
    .bar-value {
      text-align: right;
      font-variant-numeric: tabular-nums;
      color: #26323b;
    }
    .sheet-bars {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }
    .sheet-card {
      border: 1px solid var(--line);
      border-radius: 7px;
      padding: 12px;
      background: #fbfcfd;
    }
    .sheet-card strong {
      display: block;
      font-size: 14px;
      margin-bottom: 8px;
    }
    .sheet-card .mini {
      height: 10px;
      background: #e8edf2;
      border-radius: 999px;
      overflow: hidden;
      margin-top: 8px;
    }
    .sheet-card .mini span {
      display: block;
      height: 100%;
      background: var(--green);
      border-radius: 999px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    th, td {
      padding: 10px 9px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      vertical-align: top;
    }
    th {
      color: var(--muted);
      font-size: 12px;
      text-transform: uppercase;
      background: #fafbfc;
      position: sticky;
      top: 0;
    }
    .table-wrap {
      max-height: 430px;
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 8px;
    }
    .empty, .error {
      color: var(--muted);
      font-size: 14px;
      padding: 14px 0;
    }
    .error { color: var(--rose); }
    @media (max-width: 980px) {
      .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .grid { grid-template-columns: 1fr; }
      .sheet-bars { grid-template-columns: 1fr; }
      .goal-panel { grid-template-columns: 1fr; }
      .goal-side { text-align: left; }
    }
    @media (max-width: 560px) {
      .kpis { grid-template-columns: 1fr; }
      select, input, button { min-width: 100%; }
      .bar-row { grid-template-columns: 1fr; gap: 5px; margin-bottom: 12px; }
      .bar-value { text-align: left; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Dashboard de ventas</h1>
    <div class="sub">
      <span>Google Sheet conectado</span>
      <span><span class="status-dot" id="statusDot"></span><span id="statusText">Cargando datos...</span></span>
      <span id="lastUpdate"></span>
      <span>Actualiza cada 30 minutos</span>
    </div>
  </header>

  <main>
    <section class="toolbar">
      <select id="sheetFilter"></select>
      <input id="searchBox" placeholder="Buscar cliente, item o usuario">
      <button id="refreshBtn">Actualizar ahora</button>
    </section>

    <section class="kpis" id="kpis"></section>
    <section class="goal-panel" id="goalPanel">
      <div>
        <div class="goal-title">Meta del día</div>
        <div class="goal-number" id="goalSold">0 / 0</div>
      </div>
      <div class="goal-track"><div class="goal-fill" id="goalFill"></div></div>
      <div class="goal-side">
        <strong id="goalPercent">0%</strong><br>
        <span id="goalMissing">Faltan 0</span>
      </div>
    </section>

    <section class="grid">
      <article class="panel">
        <h2>Método de pago</h2>
        <div id="paymentBars"></div>
      </article>
      <article class="panel">
        <h2>Items</h2>
        <div id="productBars"></div>
      </article>
      <article class="panel wide">
        <h2>Pulseras vendidas por día y tipo</h2>
        <div class="table-wrap compact">
          <table>
            <thead><tr id="braceletHead"></tr></thead>
            <tbody id="braceletBody"></tbody>
          </table>
        </div>
      </article>
      <article class="panel">
        <h2>Cantidad por usuario</h2>
        <div id="vendorBars"></div>
      </article>
      <article class="panel">
        <h2>Estado de pago</h2>
        <div id="statusBars"></div>
      </article>
      <article class="panel">
        <h2>Clasificación cliente</h2>
        <div id="categoryBars"></div>
      </article>
    </section>
  </main>

  <script>
    const CONFIG = {
      spreadsheetId: '1V9mpNdTygNImjSzdKRNpGfwSdnYyow8Q1wFiaWz_8Sg',
      refreshMs: 30 * 60 * 1000,
      dailyGoal: 0,
      sheets: [
        { name: '2 mayo', gid: '1204926603' },
        { name: '25 abril', gid: '1491474143' },
        { name: '9 mayo', gid: '1419003531' },
      ],
    };

    const fields = {
      fecha: 'Emisión',
      pedido: 'Nº',
      producto: 'Item',
      categoria: 'Clasificación Cliente',
      cantidad: 'Cantidad Item',
      total: 'Total',
      gravado: 'Gravado',
      iva: 'Igv',
      descuento: 'Descuento',
      vendedor: 'Usuario',
      cliente: 'Cliente',
      metodo: 'Método de pago',
      pago: 'Pago',
    };

    let allRows = [];
    let isLoading = false;
    let timerId = null;

    const money = new Intl.NumberFormat('es-PE', { style: 'currency', currency: 'PEN', maximumFractionDigits: 0 });
    const num = new Intl.NumberFormat('es-PE', { maximumFractionDigits: 1 });
    const sheetFilter = document.querySelector('#sheetFilter');
    const searchBox = document.querySelector('#searchBox');
    const refreshBtn = document.querySelector('#refreshBtn');
    const statusDot = document.querySelector('#statusDot');
    const statusText = document.querySelector('#statusText');
    const lastUpdate = document.querySelector('#lastUpdate');

    sheetFilter.innerHTML = '<option value="Todas">Todas las hojas</option>' + CONFIG.sheets.map(s => '<option>' + esc(s.name) + '</option>').join('');

    function esc(value) {
      return String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[ch]));
    }

    function toNumber(value) {
      if (value === null || value === undefined || value === '') return 0;
      const cleaned = String(value)
        .replace(/S\/\.?/gi, '')
        .replace(/\s/g, '')
        .replace(/,/g, '');
      const n = Number(cleaned);
      return Number.isFinite(n) ? n : 0;
    }

    function formatMetric(value, metric) {
      return metric === fields.cantidad ? num.format(value) : money.format(value);
    }

    function setStatus(kind, text) {
      statusDot.className = 'status-dot' + (kind ? ' ' + kind : '');
      statusText.textContent = text;
    }

    function uniqueCallbackName() {
      return '__sheetCallback_' + Date.now() + '_' + Math.random().toString(36).slice(2);
    }

    function loadSheet(sheet) {
      return new Promise((resolve, reject) => {
        const cb = uniqueCallbackName();
        const script = document.createElement('script');
        const params = new URLSearchParams({
          gid: sheet.gid,
          headers: '1',
          tqx: 'responseHandler:' + cb,
          cacheBust: Date.now().toString(),
        });
        const timeoutId = window.setTimeout(() => {
          cleanup();
          reject(new Error('Tiempo agotado leyendo ' + sheet.name));
        }, 20000);

        function cleanup() {
          window.clearTimeout(timeoutId);
          delete window[cb];
          script.remove();
        }

        window[cb] = (response) => {
          cleanup();
          if (response?.status === 'error') {
            reject(new Error(response.errors?.[0]?.detailed_message || 'No se pudo leer ' + sheet.name));
            return;
          }
          const table = response.table;
          const headers = table.cols.map((col, idx) => col.label || `Columna ${idx + 1}`);
          const rows = table.rows.map((row) => {
            const obj = { hoja: sheet.name };
            headers.forEach((header, index) => {
              const cell = row.c[index];
              obj[header] = cell ? (cell.f ?? cell.v ?? '') : '';
            });
            return obj;
          }).filter(row => Object.keys(row).some(key => key !== 'hoja' && row[key] !== ''));
          resolve(rows);
        };

        script.onerror = () => {
          cleanup();
          reject(new Error('No se pudo conectar con Google Sheet. Revisa que el archivo tenga acceso para quien tenga el enlace.'));
        };
        script.src = 'https://docs.google.com/spreadsheets/d/' + CONFIG.spreadsheetId + '/gviz/tq?' + params.toString();
        document.head.appendChild(script);
      });
    }

    async function loadAll() {
      if (isLoading) return;
      isLoading = true;
      refreshBtn.disabled = true;
      refreshBtn.textContent = 'Actualizando';
      setStatus('', 'Actualizando datos...');
      try {
        const groups = await Promise.all(CONFIG.sheets.map(loadSheet));
        allRows = groups.flat();
        setStatus('ok', 'Datos actualizados');
        lastUpdate.textContent = 'Última actualización: ' + new Date().toLocaleString('es-PE');
        render();
      } catch (error) {
        setStatus('bad', error.message);
        renderError(error.message);
      } finally {
        isLoading = false;
        refreshBtn.disabled = false;
        refreshBtn.textContent = 'Actualizar ahora';
        window.clearTimeout(timerId);
        timerId = window.setTimeout(loadAll, CONFIG.refreshMs);
      }
    }

    function filteredRows() {
      const sheet = sheetFilter.value;
      const term = searchBox.value.trim().toLowerCase();
      return allRows.filter(row => {
        const sheetOk = sheet === 'Todas' || row.hoja === sheet;
        if (!sheetOk) return false;
        if (!term) return true;
        return [fields.cliente, fields.producto, fields.vendedor, fields.metodo].some(key => String(row[key] || '').toLowerCase().includes(term));
      });
    }

    function sum(rows, key) {
      return rows.reduce((acc, row) => acc + toNumber(row[key]), 0);
    }

    function groupSum(rows, key, metric, limit = 10) {
      if (!key) return [];
      const map = new Map();
      rows.forEach(row => {
        const label = row[key] || 'Sin dato';
        map.set(label, (map.get(label) || 0) + toNumber(row[metric]));
      });
      return [...map.entries()]
        .map(([label, value]) => ({ label, value }))
        .sort((a, b) => b.value - a.value)
        .slice(0, limit);
    }

    function selectedItems(rows, metric) {
      const items = ['MEDIA', 'POLO ALICRADO', 'BLOQUEADOR', 'PROTECTOR DE CELULAR', 'SHORT'];
      return items.map(label => {
        const value = rows.reduce((acc, row) => {
          const item = String(row[fields.producto] || '').trim().toUpperCase();
          return item === label ? acc + toNumber(row[metric]) : acc;
        }, 0);
        return { label, value };
      });
    }

    function normalizeDate(value) {
      const text = String(value || '').trim();
      const match = text.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
      if (!match) return text || 'Sin fecha';
      return match[1].padStart(2, '0') + '/' + match[2].padStart(2, '0') + '/' + match[3];
    }

    function braceletRows(rows) {
      const byDate = new Map();
      const types = new Set();

      rows.forEach(row => {
        const item = String(row[fields.producto] || '').trim();
        if (!item.toUpperCase().includes('PULSERA')) return;
        const date = normalizeDate(row[fields.fecha]);
        const qty = toNumber(row[fields.cantidad]);
        if (!byDate.has(date)) byDate.set(date, new Map());
        const day = byDate.get(date);
        day.set(item, (day.get(item) || 0) + qty);
        types.add(item);
      });

      const orderedTypes = [...types].sort();
      const data = [...byDate.entries()]
        .map(([date, values]) => {
          const total = orderedTypes.reduce((acc, type) => acc + (values.get(type) || 0), 0);
          return { date, values, total };
        })
        .sort((a, b) => {
          const [da, ma, ya] = a.date.split('/').map(Number);
          const [db, mb, yb] = b.date.split('/').map(Number);
          return new Date(ya, ma - 1, da) - new Date(yb, mb - 1, db);
        });

      return { orderedTypes, data };
    }

    function renderBracelets(rows) {
      const { orderedTypes, data } = braceletRows(rows);
      const head = document.querySelector('#braceletHead');
      const body = document.querySelector('#braceletBody');

      if (!data.length || !orderedTypes.length) {
        head.innerHTML = '<th>Día</th><th>Total pulseras</th>';
        body.innerHTML = '<tr><td colspan="2">Sin ventas de pulseras para esta vista.</td></tr>';
        return;
      }

      head.innerHTML = '<th>Día</th>' + orderedTypes.map(type => '<th>' + esc(type) + '</th>').join('') + '<th>Total pulseras</th>';
      body.innerHTML = data.map(day => (
        '<tr><td><strong>' + esc(day.date) + '</strong></td>' +
        orderedTypes.map(type => '<td>' + num.format(day.values.get(type) || 0) + '</td>').join('') +
        '<td><strong>' + num.format(day.total) + '</strong></td></tr>'
      )).join('');
    }

    function renderBars(id, data, metric) {
      const el = document.querySelector(id);
      if (!data.length) {
        el.innerHTML = '<div class="empty">Sin datos para esta vista.</div>';
        return;
      }
      const max = Math.max(...data.map(d => d.value), 1);
      el.innerHTML = data.map(d => (
        '<div class="bar-row"><div class="bar-label" title="' + esc(d.label) + '">' + esc(d.label) +
        '</div><div class="bar-track"><div class="bar" style="width:' + Math.max(2, d.value / max * 100) +
        '%"></div></div><div class="bar-value">' + formatMetric(d.value, metric) + '</div></div>'
      )).join('');
    }

    function braceletQuantity(rows, aliases) {
      return rows.reduce((acc, row) => {
        const item = String(row[fields.producto] || '').toUpperCase();
        const matches = aliases.some(alias => item.includes(alias));
        return matches ? acc + toNumber(row[fields.cantidad]) : acc;
      }, 0);
    }

    function renderKpis(rows) {
      const braceletTypes = [
        ['Brazalete Standar', ['PULSERA STANDARD', 'BRAZALETE STANDARD', 'BRAZALETE STANDAR']],
        ['Brazalete Full Pass', ['PULSERA FULL PASS', 'BRAZALETE FULL PASS']],
        ['Brazalete Full Day', ['PULSERA FULL DAY', 'BRAZALETE FULL DAY']],
        ['Brazalete Premium Kids', ['PULSERA PREMIUM KIDS', 'BRAZALETE PREMIUM KIDS']],
        ['Pulsera Kids', ['PULSERA KIDS', 'BRAZALETE KIDS']],
      ];
      const totalPulseras = rows.reduce((acc, row) => {
        const item = String(row[fields.producto] || '').toUpperCase();
        const matches = braceletTypes.some(([, aliases]) => aliases.some(alias => item.includes(alias)));
        return matches ? acc + toNumber(row[fields.cantidad]) : acc;
      }, 0);
      const cards = [
        ['Pulseras vendidas hasta el momento', num.format(totalPulseras)],
        ...braceletTypes.map(([label, aliases]) => [label, num.format(braceletQuantity(rows, aliases))]),
      ];
      document.querySelector('#kpis').innerHTML = cards.map(([label, value]) => (
        '<div class="kpi"><div class="label">' + esc(label) + '</div><div class="value">' + esc(value) + '</div></div>'
      )).join('');
      renderGoal(totalPulseras);
    }

    function renderGoal(totalPulseras) {
      const goalPanel = document.querySelector('#goalPanel');
      const goal = Number(CONFIG.dailyGoal) || 0;
      if (!goal) {
        goalPanel.style.display = 'none';
        return;
      }
      goalPanel.style.display = 'grid';
      const percent = Math.min(100, totalPulseras / goal * 100);
      const missing = Math.max(0, goal - totalPulseras);
      document.querySelector('#goalSold').textContent = num.format(totalPulseras) + ' / ' + num.format(goal);
      document.querySelector('#goalFill').style.width = percent + '%';
      document.querySelector('#goalPercent').textContent = num.format(percent) + '%';
      document.querySelector('#goalMissing').textContent = missing ? 'Faltan ' + num.format(missing) : 'Meta cumplida';
    }

    function renderSheets(rows, metric) {
      const data = groupSum(rows, 'hoja', metric, 20);
      const max = Math.max(...data.map(d => d.value), 1);
      document.querySelector('#sheetBars').innerHTML = data.map(d => (
        '<div class="sheet-card"><strong>' + esc(d.label) + '</strong><span>' + formatMetric(d.value, metric) +
        '</span><div class="mini"><span style="width:' + Math.max(2, d.value / max * 100) + '%"></span></div></div>'
      )).join('');
    }

    function renderTable(rows) {
      if (!document.querySelector('#thead') || !document.querySelector('#tbody')) return;
      const cols = ['hoja', fields.fecha, fields.pedido, fields.cliente, fields.producto, fields.cantidad, 'Precio Unitario', fields.descuento, fields.iva, fields.total, fields.metodo, fields.vendedor];
      document.querySelector('#thead').innerHTML = cols.map(c => '<th>' + esc(c) + '</th>').join('');
      document.querySelector('#tbody').innerHTML = rows.slice(0, 220).map(row => (
        '<tr>' + cols.map(c => '<td>' + esc(row[c]) + '</td>').join('') + '</tr>'
      )).join('');
    }

    function renderError(message) {
      document.querySelector('#kpis').innerHTML = '<div class="kpi"><div class="label">Error</div><div class="error">' + esc(message) + '</div></div>';
    }

    function render() {
      const rows = filteredRows();
      const metric = fields.cantidad;
      renderKpis(rows);
      renderBars('#paymentBars', groupSum(rows, fields.metodo, metric), metric);
      renderBars('#productBars', selectedItems(rows, metric), metric);
      renderBracelets(rows);
      renderBars('#vendorBars', groupSum(rows, fields.vendedor, metric), metric);
      renderBars('#statusBars', groupSum(rows, fields.pago, metric), metric);
      renderBars('#categoryBars', groupSum(rows, fields.categoria, metric), metric);
    }

    sheetFilter.addEventListener('change', render);
    searchBox.addEventListener('input', render);
    refreshBtn.addEventListener('click', loadAll);
    loadAll();
  </script>
</body>
</html>
